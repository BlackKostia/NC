name: Feature Request
description: Propose a workflow improvement, VFS package, or UI capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / problem to solve
      description: What workflow is currently slow or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Should this live in the zero-libc core binary or as an out-of-process package under `packages/`?
    validations:
      required: true
